name: hourly-price-refresh

on:
  schedule:
    - cron: "7 * * * *"        # 每小时第 7 分钟（UTC），脚本内部记录巴黎时间
  workflow_dispatch: {}         # 支持手动触发

permissions:
  contents: write

concurrency:
  group: price-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run price scraper
        run: python3 refresh.py

      - name: Commit updated feed
        run: |
          git config user.name "gtm-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add aiper-gtm-feed.js
          if git diff --cached --quiet; then
            echo "No feed changes to commit"
          else
            git pull --rebase --autostash
            git commit -m "chore: price feed $(TZ=Europe/Paris date +'%Y-%m-%d %H:00')"
            git push
          fi
