name: hourly-price-refresh

on:
  schedule:
    - cron: "7 * * * *"        # 每小时第 7 分钟（UTC），脚本内部记录巴黎时间
  workflow_dispatch: {}         # 支持手动触发

permissions:
  contents: write

concurrency:
  group: price-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Run price scraper (cloud targets — aiper.store / eRobot / Irripiscine / pool-systems)
        env:
          GTM_MODE: cloud
        run: python3 refresh.py

      - name: Run price scraper (Apify-rendered targets — Hornbach / MyPiscine / Leroy Merlin)
        env:
          GTM_MODE: apify
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python3 refresh.py
        continue-on-error: true   # Apify 免费额度耗尽或超时不应阻断其余渠道的记录

      - name: Commit updated feeds
        run: |
          git config user.name "gtm-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add aiper-gtm-feed.js aiper-gtm-feed-apify.js
          if git diff --cached --quiet; then
            echo "No feed changes to commit"
          else
            git pull --rebase --autostash
            git commit -m "chore: price feed $(TZ=Europe/Paris date +'%Y-%m-%d %H:00')"
            git push
          fi
